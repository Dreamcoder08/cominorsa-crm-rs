[workspace]
members = [
    "crates/domain",
    "crates/storage",
    "crates/importer",
    "crates/application",
    "crates/cli",
    "crates/desktop",
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
publish = false

[workspace.dependencies]
cominorsa-application = { path = "crates/application" }
cominorsa-domain = { path = "crates/domain" }
cominorsa-importer = { path = "crates/importer" }
cominorsa-storage = { path = "crates/storage" }
clap = { version = "4", features = ["derive"] }
csv = "1"
dioxus = { version = "0.7", default-features = false, features = ["desktop", "hooks", "html", "launch", "macro", "signals"] }
dioxus-ssr = "0.7"
directories = "6"
embed-resource = "3"
krilla = { version = "0.8", default-features = false, features = ["simple-text"] }
rfd = "0.17"
# Same minor as krilla, so the font parser is compiled once.
skrifa = "0.42"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["macros", "migrate", "runtime-tokio", "sqlite"] }
thiserror = "2"
time = { version = "0.3", features = ["formatting", "macros", "parsing"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
uuid = { version = "1", features = ["v5", "v7"] }

[workspace.lints.rust]
unsafe_code = "forbid"
