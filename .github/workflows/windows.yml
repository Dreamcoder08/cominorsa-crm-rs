name: Windows build

on:
  push:
    branches: [main, "feat/**"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      - name: Install test tools
        run: choco install sqlite --no-progress -y
      - name: Test
        run: cargo test --workspace --locked --no-fail-fast
      - name: Build release binaries
        run: cargo build --release --locked -p cominorsa-desktop -p cominorsa-importer -p cominorsa-cli
      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist | Out-Null
          Copy-Item target/release/cominorsa-desktop.exe dist/
          Copy-Item target/release/cominorsa-import.exe dist/
          Copy-Item target/release/cominorsa.exe dist/
          Compress-Archive dist/* cominorsa-crm-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cominorsa-crm-windows-x64
          path: cominorsa-crm-windows-x64.zip
          if-no-files-found: error
          retention-days: 30
